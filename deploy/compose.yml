services:
  api:
    image: ghcr.io/lefevrk/credit-scoring-api:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:8000"
    env_file:
      - .env

  # Same config.alloy as the local stack (deploy/alloy/config.alloy) — only
  # the .env values differ, pointing this collector at Grafana Cloud instead
  # of the local Prometheus/Loki containers. No self-hosted Prometheus/Loki/
  # Grafana here: Grafana Cloud is the single instance for release and prod.
  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    env_file:
      - .env
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    depends_on:
      - api
