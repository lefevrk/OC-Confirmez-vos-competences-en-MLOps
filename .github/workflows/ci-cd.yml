name: CI/CD

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/credit-scoring-api

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # --group drift: scripts/ now ships drift-analysis code covered by
        # lint/type-check/tests too (evidently itself is only imported by
        # the notebook, never by pytest-collected code).
        run: uv sync --extra api --group drift

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        # tests/conftest.py starts its own PostgreSQL via testcontainers and
        # migrates it — the ubuntu-latest runner ships Docker, no service
        # container or $DATABASE_URL needed here.
        run: uv run pytest --cov=api --cov-report=term-missing --cov-fail-under=80

  determine-target:
    needs: quality-gate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      image_tag: ${{ steps.set.outputs.image_tag }}
      test_depth: ${{ steps.set.outputs.test_depth }}
    steps:
      - id: set
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            {
              echo "environment=production"
              echo "image_tag=prod"
              echo "test_depth=sanity"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "environment=release"
              echo "image_tag=release"
              echo "test_depth=full"
            } >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: determine-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ needs.determine-target.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [determine-target, build-and-push]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.determine-target.outputs.environment }}
      test_depth: ${{ needs.determine-target.outputs.test_depth }}
    secrets: inherit
