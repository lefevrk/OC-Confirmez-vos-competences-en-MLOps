[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[project]
name = "credit-scoring-api"
version = "0.3.0"
description = "Credit scoring API — inference service (MLOps deployment repo)"
authors = [
  { name = "Kilian LEFEVRE" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
dependencies = [
    "lightgbm==4.7.0",
    "loguru",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
]
requires-python = ">=3.10.0"

[project.optional-dependencies]
# Runtime deps for the deployed API image (see Dockerfile).
api = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "mlflow",
    "prometheus-client",
]

[tool.ruff]
line-length = 100
src = ["src"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "migrations/**/*.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B"]
ignore = [
    "E501",
    "D100",
    "D104",
    "B008",  # FastAPI's Depends()/Security() are meant to live in argument defaults.
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated migration files follow its own template conventions,
# not this project's docstring style.
"migrations/**/*.py" = ["D103", "D415"]

[tool.ruff.lint.isort]
known-first-party = ["api"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py", "**/test_.py", "test.py"]

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff>=0.14.14",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "testcontainers[postgres]",
]
