[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/ui"]

[project]
name = "credit-scoring-api"
version = "0.6.2"
description = "Credit scoring API — inference service (MLOps deployment repo)"
authors = [
  { name = "Kilian LEFEVRE" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
dependencies = []
requires-python = ">=3.10.0"

[project.optional-dependencies]
# Runtime deps for the deployed API image (see Dockerfile).
api = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "mlflow",
    "onnxruntime",
    "prometheus-client",
    "gradio>=4.0,<6.0",
    "httpx",
    "loguru",
    "numpy",
    "pandas",
]

[tool.ruff]
line-length = 100
src = ["src"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "migrations/**/*.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B"]
ignore = [
    "E501",
    "D100",
    "D104",
    "B008",  # FastAPI's Depends()/Security() are meant to live in argument defaults.
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated migration files follow its own template conventions,
# not this project's docstring style.
"migrations/**/*.py" = ["D103", "D415"]

[tool.ruff.lint.isort]
known-first-party = ["api"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py", "**/test_.py", "test.py"]

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff>=0.14.14",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "testcontainers[postgres]",
    # CLI framework for scripts/ entry points (drift, profiling, ...) — kept
    # in the default group, not `drift`, since it's the project-wide
    # convention for any script's CLI, not drift-specific tooling.
    "typer",
    # Interactive viewer for the .prof files scripts/profiling/ produces
    # (`uv run snakeviz reports/profiling/<label>_predict.prof`).
    "snakeviz",
    # Renders the before/after comparison charts in
    # scripts/profiling/plot_comparison.py.
    "matplotlib",
    # Loads .env for scripts/ entry points (drift, docs generation, ...) —
    # same rationale as `typer` above: project-wide script tooling, not
    # specific to `drift`, and never imported by src/api itself.
    "python-dotenv",
]
# Data drift analysis tooling (scripts/, notebooks/) — kept out of the
# default dev sync so day-to-day API work doesn't pay Evidently's heavier
# install cost locally. CI syncs it explicitly (--group drift) since
# scripts/ code is still linted/type-checked/tested like everything else.
drift = [
    "pyarrow",
    "evidently",
    "huggingface_hub",
    "jupyter",
    "ipykernel",
]
# Documentation (mkdocs) — isolated from the default sync, same rationale
# as `drift`: this toolchain isn't needed for day-to-day API work. CI syncs
# it explicitly (--group docs) in .github/workflows/docs.yml.
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-glightbox",
    "mkdocs-panzoom-plugin",
]
