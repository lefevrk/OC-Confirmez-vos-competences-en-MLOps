name: oc-confirmez-vos-competences-en-mlops

services:
  api:
    build: .
    image: credit-scoring-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the .env value so the containerized API reaches Postgres
      # over the compose network; `make db-migrate` (run on the host) keeps
      # using the .env value instead, which points at the published port.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/credit_scoring
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_scoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.10.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.6.2
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    env_file:
      - .env
    ports:
      - "12345:12345"
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor needs these to read per-container stats — the Docker socket
      # alone only gives it container metadata, not cgroup/disk usage.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # Docker's containerd-snapshotter storage backend moves layer info out
      # of /var/lib/docker/image/... into containerd itself — cAdvisor needs
      # this socket to resolve it, or every container fails with "unable to
      # create containerd client for overlayfs storage driver".
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    depends_on:
      - api
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
